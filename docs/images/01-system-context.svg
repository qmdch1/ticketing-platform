<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ticketing Platform System Context</title>
  <desc id="desc">티켓팅 플랫폼의 외부 사용자, API, 애플리케이션, PostgreSQL, Redis, Kafka, 운영 엔드포인트 구조</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 42px 'Segoe UI',Arial,sans-serif;fill:#111827}.sub{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#243447}
      .box{fill:#fff;stroke:#ccd5e1;stroke-width:2}.primary{fill:#163b6d;stroke:#0f2b50}.accent{fill:#e8f1ff;stroke:#7aa7e8}
      .label{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#111827}.labelWhite{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#fff}.text{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#1f2937}
      .arrow{stroke:#334155;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.note{fill:#fff7e8;stroke:#e2b660;stroke-width:2}.mono{font:700 17px Consolas,monospace;fill:#1f2937}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text x="64" y="72" class="title">System Context</text>
  <text x="64" y="108" class="sub">좌석 선점부터 결제 승인까지 하나의 구매 플로우를 제공하는 Spring Boot 기반 티켓팅 API</text>

  <rect x="70" y="210" width="220" height="150" rx="12" class="box"/>
  <text x="110" y="260" class="label">Customer</text>
  <text x="105" y="295" class="text">좌석 조회</text>
  <text x="105" y="325" class="text">예약 요청</text>
  <text x="105" y="355" class="text">결제 승인</text>

  <rect x="390" y="170" width="500" height="250" rx="16" class="primary"/>
  <text x="490" y="222" class="labelWhite">Ticketing Platform API</text>
  <text x="450" y="270" class="labelWhite">Spring MVC + JPA</text>
  <text x="450" y="312" class="text" fill="#f3f8ff">ReservationService: 좌석 홀드와 만료</text>
  <text x="450" y="344" class="text" fill="#f3f8ff">WaitingQueueService: Redis 대기열 토큰</text>
  <text x="450" y="376" class="text" fill="#f3f8ff">PaymentService: 결제, 티켓 발급, Kafka 이벤트</text>

  <rect x="990" y="145" width="220" height="130" rx="12" class="box"/>
  <text x="1042" y="195" class="label">PostgreSQL</text>
  <text x="1025" y="232" class="text">구매 도메인 저장</text>
  <text x="1025" y="262" class="text">Flyway 스키마</text>

  <rect x="990" y="315" width="220" height="110" rx="12" class="accent"/>
  <text x="1062" y="358" class="label">Redis</text>
  <text x="1025" y="392" class="text">좌석 캐시 / 대기열</text>

  <rect x="990" y="465" width="220" height="110" rx="12" class="accent"/>
  <text x="1062" y="508" class="label">Kafka</text>
  <text x="1025" y="542" class="text">티켓 발급 이벤트</text>

  <rect x="405" y="500" width="470" height="100" rx="12" class="note"/>
  <text x="438" y="542" class="label">핵심 품질 속성</text>
  <text x="438" y="575" class="text">동시성 제어, 멱등성, 트랜잭션 원자성, 운영 관측성</text>

  <path d="M290 285 H380" class="arrow"/>
  <path d="M890 235 H980" class="arrow"/>
  <path d="M890 360 H980" class="arrow"/>
  <path d="M890 405 C930 440 945 500 980 520" class="arrow"/>
  <path d="M640 420 V490" class="arrow"/>
</svg>

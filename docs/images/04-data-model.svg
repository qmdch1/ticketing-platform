<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Data Model</title>
  <desc id="desc">티켓팅 플랫폼 데이터 모델과 주요 제약 조건</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 42px 'Segoe UI',Arial,sans-serif;fill:#172033}.sub{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#526070}
      .table{fill:#fff;stroke:#ccd5e1;stroke-width:2}.head{fill:#163b6d}.headText{font:700 20px 'Segoe UI',Arial,sans-serif;fill:white}.col{font:400 16px Consolas,monospace;fill:#263445}
      .key{font:700 16px Consolas,monospace;fill:#0f4c81}.rel{stroke:#344054;stroke-width:3;fill:none;marker-end:url(#arrow)}.note{fill:#fff7e8;stroke:#e2b660;stroke-width:2}.text{font:500 17px 'Segoe UI',Arial,sans-serif;fill:#263445}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker>
  </defs>
  <rect class="bg" width="1280" height="920"/>
  <text x="64" y="70" class="title">Data Model</text>
  <text x="64" y="106" class="sub">좌석 선점과 구매 확정을 위한 테이블, 참조 관계, 유니크 제약</text>

  <g transform="translate(70 155)">
    <rect width="280" height="150" rx="10" class="table"/><rect width="280" height="44" rx="10" class="head"/><text x="18" y="29" class="headText">performances</text>
    <text x="18" y="75" class="key">PK id</text><text x="18" y="105" class="col">title</text><text x="18" y="135" class="col">starts_at</text>
  </g>

  <g transform="translate(450 135)">
    <rect width="330" height="260" rx="10" class="table"/><rect width="330" height="44" rx="10" class="head"/><text x="18" y="29" class="headText">seats</text>
    <text x="18" y="75" class="key">PK id</text><text x="18" y="105" class="key">FK performance_id</text><text x="18" y="135" class="col">section, seat_number</text>
    <text x="18" y="165" class="col">price</text><text x="18" y="195" class="col">status</text><text x="18" y="225" class="col">reservation_id</text><text x="18" y="250" class="col">version</text>
  </g>

  <g transform="translate(900 155)">
    <rect width="300" height="230" rx="10" class="table"/><rect width="300" height="44" rx="10" class="head"/><text x="18" y="29" class="headText">reservations</text>
    <text x="18" y="75" class="key">PK id</text><text x="18" y="105" class="key">FK performance_id</text><text x="18" y="135" class="col">customer_id</text>
    <text x="18" y="165" class="col">status</text><text x="18" y="195" class="col">expires_at</text><text x="18" y="220" class="col">created_at</text>
  </g>

  <g transform="translate(900 475)">
    <rect width="300" height="145" rx="10" class="table"/><rect width="300" height="44" rx="10" class="head"/><text x="18" y="29" class="headText">reservation_seats</text>
    <text x="18" y="75" class="key">PK reservation_id</text><text x="18" y="105" class="key">PK seat_id</text><text x="18" y="130" class="col">reservation-seat snapshot</text>
  </g>

  <g transform="translate(70 515)">
    <rect width="310" height="210" rx="10" class="table"/><rect width="310" height="44" rx="10" class="head"/><text x="18" y="29" class="headText">ticket_orders</text>
    <text x="18" y="75" class="key">PK id</text><text x="18" y="105" class="key">UK reservation_id</text><text x="18" y="135" class="col">customer_id</text>
    <text x="18" y="165" class="col">total_amount</text><text x="18" y="195" class="col">status, created_at</text>
  </g>

  <g transform="translate(480 515)">
    <rect width="300" height="210" rx="10" class="table"/><rect width="300" height="44" rx="10" class="head"/><text x="18" y="29" class="headText">payments</text>
    <text x="18" y="75" class="key">PK id</text><text x="18" y="105" class="key">FK order_id</text><text x="18" y="135" class="key">UK idempotency_key</text>
    <text x="18" y="165" class="col">amount</text><text x="18" y="195" class="col">status, approved_at</text>
  </g>

  <g transform="translate(900 690)">
    <rect width="300" height="185" rx="10" class="table"/><rect width="300" height="44" rx="10" class="head"/><text x="18" y="29" class="headText">tickets</text>
    <text x="18" y="75" class="key">PK id</text><text x="18" y="105" class="key">FK order_id</text><text x="18" y="135" class="key">UK ticket_code</text><text x="18" y="165" class="col">performance_id, seat_id</text>
  </g>

  <path d="M350 230 H440" class="rel"/><path d="M780 230 H890" class="rel"/><path d="M1050 385 V465" class="rel"/>
  <path d="M900 548 H790 C660 548 510 548 390 600" class="rel"/><path d="M380 620 H470" class="rel"/><path d="M780 620 C840 650 870 720 895 770" class="rel"/>
  <path d="M780 265 C850 330 880 480 900 540" class="rel"/>

  <rect x="70" y="790" width="760" height="64" rx="12" class="note"/>
  <text x="100" y="828" class="text">중요 제약: 좌석 중복 방지 unique(performance_id, section, seat_number), 주문 중복 방지 unique(reservation_id), 결제 재시도 방지 unique(idempotency_key)</text>
</svg>
